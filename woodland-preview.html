t(351,143,18,17,'#b4d6c1');rect(326,176,3,3,'#e6ce8e');status.textContent='Outdoor woodland · click cabin to enter';}else{for(let j=0;j<13;j++)for(let i=0;i<20;i++)rect(i*32+1,j*32+1,30,30,(i+j)%2?'#c79a68':'#bd8e60');rect(40,36,560,328,'#80563d');rect(52,48,536,304,'#cba675');rect(70,70,150,70,'#78533c');rect(78,78,134,54,'#d7b58b');rect(86,86,50,35,'#739c76');rect(260,70,120,72,'#7d5338');rect(270,80,100,52,'#bd986e');rect(410,70,120,70,'#654936');rect(422,82,96,46,'#b5a081');rect(210,220,220,88,'#8e6747');rect(220,230,200,68,'#b99467');rect(300,332,40,20,'#5d4737');status.textContent='Cabin interior · click anywhere to exit';}}c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),a=(e.clientX-r.left)*640/r.width,b=(e.clientY-r.top)*400/r.height;if(inside){inside=false;draw()}else if(a>=260&&a<=391&&b>=70&&b<=205){inside=true;draw()}});draw();</script>
