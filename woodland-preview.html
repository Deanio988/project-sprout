<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Sprout — Woodland prototype</title><style>body{margin:0;background:#15271f;color:#e5f2db;font:16px system-ui;text-align:center}main{max-width:900px;margin:auto;padding:18px}canvas{width:100%;max-width:800px;image-rendering:pixelated;border:4px solid #65815b;border-radius:10px}a{color:#c9e5a6}</style><main><h1>🌲 Project Sprout — Woodland Art Direction</h1><p>New muted-palette woodland study · click the cabin to inspect its interior · click outside to return</p><canvas id="world" width="640" height="400"></canvas><p id="status">Outdoor woodland · 32px tile scale</p><p><a href="./">← Return to Spriglet</a></p></main><script>'use strict';const c=document.querySelector('canvas'),x=c.getContext('2d'),status=document.querySelector('#status');x.imageSmoothingEnabled=false;let inside=false;function rng(a,b){let v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)}function rect(a,b,w,h,color){x.fillStyle=color;x.fillRect(a,b,w,h)}const palette={outline:'#443955',trunk:'#66506a',shadow:'#1b6874',deep:'#267e83',leaf:'#8c9f85',light:'#aeb69a',grass:'#79a99b',path:'#cf927f',pathShade:'#ae756f',roof:'#769dbb',roofDark:'#60547c',wood:'#b77f70'};function tree(a,b,s=1){x.save();x.translate(a,b);x.scale(s,s);rect(-7,4,14,26,palette.trunk);rect(-3,7,6,20,'#9c6f78');for(let k=0;k<4;k++){let cx=[-15,14,-6,7][k],cy=[-18,-17,-33,-31][k],rr=[22,23,24,21][k];x.fillStyle=palette.outline;x.beginPath();x.arc(cx,cy,rr+3,0,7);x.fill();x.fillStyle=[palette.deep,palette.shadow,palette.leaf,palette.light][k];x.beginPath();x.arc(cx,cy,rr,0,7);x.fill();for(let n=0;n<5;n++)rect(cx-12+n*5,cy-8+(n%3)*7,4,3,k>1?'#788b83':'#335e73')}x.restore()}function cottage(){rect(270,123,112,88,palette.outline);rect(277,129,98,77,palette.wood);for(let i=0;i<5;i++)rect(278,138+i*13,96,3,'#825a6e');x.fillStyle=palette.outline;x.beginPath();x.moveTo(254,134);x.lineTo(326,65);x.lineTo(399,134);x.lineTo(387,144);x.lineTo(326,85);x.lineTo(266,144);x.fill();x.fillStyle=palette.roof;x.beginPath();x.moveTo(263,132);x.lineTo(326,74);x.lineTo(390,132);x.lineTo(380,137);x.lineTo(326,90);x.lineTo(273,137);x.fill();for(let i=0;i<5;i++){rect(278+i*10,126-i*9,45,2,palette.roofDark);rect(326+i*9,85+i*9,43,2,palette.roofDark)}rect(313,160,28,47,palette.outline);rect(318,164,19,42,palette.roofDark);rect(332,185,3,4,'#e7c69d');for(let a of [285,351]){rect(a,145,20,21,palette.outline);rect(a+4,149,12,13,palette.roof);rect(a+9,149,2,13,palette.outline)}rect(283,203,88,6,'#60506e');rect(286,207,7,7,'#67516b');rect(361,207,7,7,'#67516b')}function detail(a,b,r){if(r>.75){rect(a,b,3,6,'#3b8380');rect(a+4,b+2,3,4,'#226c75')}else if(r>.52){rect(a,b,5,3,'#d5b18b');rect(a+2,b-3,2,3,'#f0d4a3')}else if(r>.3){rect(a,b,5,3,'#a36d75');rect(a+3,b+2,4,2,'#876276')}}function draw(){rect(0,0,640,400,inside?'#ae865d':'#75a568');if(!inside){rect(0,0,640,400,palette.grass);for(let j=0;j<25;j++)for(let i=0;i<40;i++){let px=i*16,py=j*16,r=rng(i,j);if(r>.64)rect(px,py,15,12,r>.84?'#82afa0':'#72a49a');detail(px+Math.floor(r*9),py+Math.floor(rng(j,i)*9),rng(i+11,j+7))}for(let j=0;j<13;j++){let py=205+j*16;let px=326+Math.sin(j*.52)*23;rect(px-20,py,44,18,palette.path);rect(px-14+Math.floor(rng(j,4)*15),py+8,9,3,palette.pathShade)}for(let i=0;i<20;i++){let px=i*32,py=310+Math.sin(i*.31)*13;if(px<265||px>390){rect(px,py,35,26,palette.path);rect(px+5,py+8,7,3,palette.pathShade)}}for(let j=0;j<12;j++)for(let i=0;i<21;i++){let r=rng(i+20,j+12),px=i*32+14,py=j*34+17;if(r>.68&&(i<7||i>13||j<2||j>9)&&!(py>275&&py<360))tree(px,py,.72+r*.48)}cottage();rect(438,241,22,20,palette.outline);rect(442,244,14,12,'#a47870');rect(445,246,8,5,'#d4af91');rect(479,265,11,8,'#856579');rect(483,261,3,5,'#d2a183');status.textContent='Outdoor woodland · click cabin to enter';}else{for(let j=0;j<13;j++)for(let i=0;i<20;i++)rect(i*32+1,j*32+1,30,30,(i+j)%2?'#c79a68':'#bd8e60');rect(40,36,560,328,'#80563d');rect(52,48,536,304,'#cba675');rect(70,70,150,70,'#78533c');rect(78,78,134,54,'#d7b58b');rect(86,86,50,35,'#739c76');rect(260,70,120,72,'#7d5338');rect(270,80,100,52,'#bd986e');rect(410,70,120,70,'#654936');rect(422,82,96,46,'#b5a081');rect(210,220,220,88,'#8e6747');rect(220,230,200,68,'#b99467');rect(300,332,40,20,'#5d4737');status.textContent='Cabin interior · click anywhere to exit';}}c.addEventListener('click',e=>{const r=c.getBoundingClientRect(),a=(e.clientX-r.left)*640/r.width,b=(e.clientY-r.top)*400/r.height;if(inside){inside=false;draw()}else if(a>=260&&a<=391&&b>=70&&b<=205){inside=true;draw()}});draw();</script>
